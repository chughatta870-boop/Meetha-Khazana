<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A1F3D">
<meta name="description" content="100 روایتی پاکستانی مٹھائیوں کی ترکیبیں — اجزاء اور مرحلہ وار طریقہ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="میٹھا خزانہ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>میٹھا خزانہ — 100 پاکستانی مٹھائیاں</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-plate">
    <div class="splash-balls">
      <span class="ball b1"></span><span class="ball b2"></span><span class="ball b3"></span>
    </div>
  </div>
  <p class="splash-title">میٹھا خزانہ</p>
  <p class="splash-sub">100 روایتی پاکستانی مٹھائیاں</p>
</div>

<header class="topbar">
  <div class="topbar-row">
    <button id="menuBtn" class="icon-btn" aria-label="مینو کھولیں">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <h1 class="brand">میٹھا <span>خزانہ</span></h1>
    <button id="favBtn" class="icon-btn" aria-label="پسندیدہ مٹھائیاں">
      <svg id="favIcon" viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.4 5.3c2.3-1.3 4.9-.6 6.3 1.4l1.3 1.8 1.3-1.8c1.4-2 4-2.7 6.3-1.4 2.8 1.6 3.4 4.9 1.7 7.6C18.7 16.65 12 21 12 21z"/></svg>
    </button>
  </div>
  <div class="search-row">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="searchInput" type="search" placeholder="مٹھائی یا جزو تلاش کریں…" autocomplete="off">
    <button id="clearSearch" class="clear-btn" hidden aria-label="صاف کریں">✕</button>
  </div>
  <div id="chips" class="chips"></div>
</header>

<main id="mainView">
  <div id="resultMeta" class="result-meta"></div>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state" hidden>
    <p>😔 کوئی مٹھائی نہیں ملی</p>
    <span>مختلف لفظ سے تلاش کریں</span>
  </div>
</main>

<div id="detailOverlay" class="overlay" hidden>
  <div class="detail-sheet" role="dialog" aria-modal="true">
    <div class="detail-hero">
      <button id="backBtn" class="icon-btn on-hero" aria-label="واپس">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17 12H7m5 5-5-5 5-5"/></svg>
      </button>
      <button id="detailFavBtn" class="icon-btn on-hero" aria-label="پسندیدہ">
        <svg id="detailFavIcon" viewBox="0 0 24 24" width="21" height="21"><path fill="currentColor" d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.4 5.3c2.3-1.3 4.9-.6 6.3 1.4l1.3 1.8 1.3-1.8c1.4-2 4-2.7 6.3-1.4 2.8 1.6 3.4 4.9 1.7 7.6C18.7 16.65 12 21 12 21z"/></svg>
      </button>
      <div class="hero-decor"><span></span><span></span><span></span></div>
      <span id="detailNum" class="detail-num"></span>
      <h2 id="detailName" class="detail-name"></h2>
      <span id="detailCat" class="detail-cat"></span>
    </div>
    <div class="detail-body">
      <section class="detail-section">
        <h3>🥣 اجزاء</h3>
        <ul id="detailIngredients" class="ing-list"></ul>
      </section>
      <section class="detail-section">
        <h3>👩‍🍳 ترکیب</h3>
        <ol id="detailSteps" class="step-list"></ol>
      </section>
      <p class="watermark">M Ijaz · GHS 124/NB</p>
    </div>
  </div>
</div>

<nav id="bottomNav" class="bottom-nav">
  <button class="nav-btn active" data-view="all">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
    <span>سب مٹھائیاں</span>
  </button>
  <button class="nav-btn" data-view="fav">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.4 5.3c2.3-1.3 4.9-.6 6.3 1.4l1.3 1.8 1.3-1.8c1.4-2 4-2.7 6.3-1.4 2.8 1.6 3.4 4.9 1.7 7.6C18.7 16.65 12 21 12 21z"/></svg>
    <span>پسندیدہ</span>
  </button>
  <button class="nav-btn" data-view="random">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 3h4v4h-2V6.4l-3.6 3.6-1.4-1.4L17.6 5H16zm4 14v4h-4v-2h1.6l-3.6-3.6 1.4-1.4 3.6 3.6V17zM3 3h4v2H5.4l3.6 3.6-1.4 1.4L4 6.4V8H2V4a1 1 0 0 1 1-1zm0 18a1 1 0 0 1-1-1v-4h2v1.6l3.6-3.6 1.4 1.4L5.4 19H7v2z"/></svg>
    <span>آج کیا بنائیں؟</span>
  </button>
  <button class="nav-btn" id="installNav" data-view="install" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3v10.5l3.5-3.5 1.4 1.4L12 16.8l-4.9-4.9 1.4-1.4L12 13.5V3zM5 19h14v2H5z"/></svg>
    <span>ایپ انسٹال کریں</span>
  </button>
</nav>

<div id="toast" class="toast" hidden></div>

<script src="recipes-data.js"></script>
<script src="script.js"></script>
</body>
</html>
